<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RFID Avtopark{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Ashiq renler palitrasi (Light Mode) */
      --bg: #f3f4f6;          /* Ashiq kulren fon */
      --surface: #ffffff;     /* Aq kartalar */
      --border: #e5e7eb;      /* Ashiq sziqlar */
      
      --primary: #2563eb;     /* Kok ren (tiykargi) */
      --primary-hover: #1d4ed8;
      --success: #059669;     /* Jasil */
      --warning: #d97706;     /* Sari/Qizgilt */
      --danger: #dc2626;      /* Qizil */
      
      --text-main: #111827;   /* Qara tekst */
      --text-muted: #6b7280;  /* Kulren tekst */
      
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'Fira Code', monospace;
      
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* --- NAVBAR (Joqarqi menyu) --- */
    nav {
      position: sticky; top: 0; z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      padding: 0 2rem;
      height: 70px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .nav-brand {
      display: flex; align-items: center; gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-brand .icon {
      background: var(--primary);
      color: white;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      font-size: 1.1rem;
    }

    .nav-links { display: flex; align-items: center; gap: 0.75rem; }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--primary);
      background: #eff6ff;
    }
    .btn-nav-add {
      background: var(--primary) !important;
      color: white !important;
    }
    .btn-nav-add:hover { background: var(--primary-hover) !important; }

    /* --- TIYKARGI BóLIm --- */
    main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

    /* --- KARTALAR --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: #fdfdfd;
    }
    .card-header h2 {
      font-size: 1.1rem; font-weight: 600;
      color: var(--text-main);
    }
    .card-body { padding: 1.5rem; }

    /* --- KESTELER (Jadval) --- */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 1rem 1.5rem;
      border-bottom: 2px solid var(--border);
      text-align: left;
      background: #f9fafb;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9fafb; }
    tbody td { padding: 1rem 1.5rem; font-size: 0.95rem; vertical-align: middle; }

    /* --- BELGILER (Badges) --- */
    .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; font-weight: 600;
      padding: 0.3rem 0.75rem; border-radius: 9999px;
    }
    .badge-in { background: #d1fae5; color: var(--success); }
    .badge-out { background: #fef3c7; color: var(--warning); }
    .badge-denied { background: #fee2e2; color: var(--danger); }
    .badge-inside { background: #dbeafe; color: var(--primary); }

    .mono-tag {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }
    .plate { font-weight: 600; color: var(--text-main); letter-spacing: 0.05em; }
    .duration { color: var(--text-muted); font-size: 0.9rem; }

    /* --- KNOPKALAR --- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-weight: 500; font-size: 0.95rem;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      border: none; cursor: pointer; text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 1px 2px rgba(37,99,235,0.3); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: white; border: 1px solid #d1d5db; color: var(--text-main); }
    .btn-ghost:hover { background: #f3f4f6; }

    /* --- FORMALAR --- */
    .form-group { margin-bottom: 1.5rem; }
    .form-label {
      display: block; font-size: 0.85rem; font-weight: 500;
      color: var(--text-main); margin-bottom: 0.5rem;
    }
    .form-control {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 1rem;
      padding: 0.75rem 1rem;
      transition: all 0.2s;
      outline: none;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* --- QOSIMSHA --- */
    .text-muted { color: var(--text-muted); }
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav>
  <a class="nav-brand" href="{% url 'dashboard' %}">
    <div class="icon">P</div>
    Aqıllı Parkovka
  </a>
  <div class="nav-links">
    <a href="{% url 'dashboard' %}">Bas bet</a>
    <a href="{% url 'history' %}">Tariyx</a>
    <a href="{% url 'add_car' %}" class="btn btn-nav-add">+ Avto qosıw</a>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

{% block extra_js %}{% endblock %}
</body>
</html>
